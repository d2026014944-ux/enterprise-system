# ─────────────────────────────────────────────────────────────
# Kubernetes ConfigMap — Non-sensitive configuration
# ─────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-system-config
  labels:
    app: enterprise-system
data:
  NODE_ENV: "production"
  PORT: "3000"
  GLOBAL_PREFIX: "api/v1"
  LOG_LEVEL: "info"
  API_VERSION: "1.0.0"
  CORS_ORIGINS: "https://enterprise.system"
  SHUTDOWN_TIMEOUT_MS: "10000"
  RATE_LIMIT_DEFAULT: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
